onboarding = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[ui]
# 入力待ちのAgentを優先し、分割PaneにもAgent名を表示する。
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
rows = [["state_icon", "agent", "state_text"], ["workspace", "tab", "pane"]]

[ui.sound]
enabled = false

[experimental]
kitty_graphics = true

pane_history = false
[keys]
# k/t/n/s = left/down/up/right
focus_pane_left = "prefix+k"
focus_pane_down = "prefix+t"
focus_pane_up = "prefix+n"
focus_pane_right = "prefix+s"

# prefix+n と prefix+s はペイン移動で使うため退避する。
previous_tab = "prefix+left"
next_tab = "prefix+right"
previous_workspace = "prefix+up"
next_workspace = "prefix+down"
settings = "prefix+shift+s"

# prefix+1..9 はTab切り替え、Shift付きはAgent切り替えに使う。
focus_agent = "prefix+shift+1..9"

# Workspace navigationでも同じ配列を使う。
navigate_pane_left = "k"
navigate_pane_down = "t"
navigate_pane_up = "n"
navigate_pane_right = "s"

[theme]
name = "terminal"
auto_switch = false

[ui.toast]
# バックグラウンドのAgentの完了・入力待ちをHerdr内で通知する。
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"
